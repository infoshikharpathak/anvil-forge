[project]
name = "garrison-hq"
version = "0.1.0"
description = "garrison control plane: accounts, apps, tools, agents, prompt versions, flows, grants, app keys, and the bundle API the SDK's remote mode pulls from."
requires-python = ">=3.11"
dependencies = [
  # The SDK in this repo (install both: pip install -e sdk -e server).
  # Its config compiler validates every write.
  "garrison",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
garrison-hq = "garrison_hq.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["garrison_hq*"]

[tool.setuptools.package-data]
garrison_hq = ["migrations/*.py", "migrations/versions/*.py", "migrations/script.py.mako", "templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
