[project]
name = "garrison-hq"
version = "0.1.1"
description = "The Garrison control plane: accounts, apps, tools, agents with versioned prompts, flows, grants, app keys, the bundle API for the SDK's remote mode, and trace dashboards."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Shikhar Pathak" }]
requires-python = ">=3.11"
keywords = ["agents", "llm", "governance", "control-plane", "dashboard", "tracing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
  "Framework :: FastAPI",
]
dependencies = [
  # The SDK; its config compiler validates every write.
  "garrison-sdk>=0.1.1,<0.2",  # 0.1.1: remote_agent tools with a full endpoint
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/infoshikharpathak/garrison"
Repository = "https://github.com/infoshikharpathak/garrison"
Issues = "https://github.com/infoshikharpathak/garrison/issues"
Changelog = "https://github.com/infoshikharpathak/garrison/blob/main/CHANGELOG.md"

[project.scripts]
garrison-hq = "garrison_hq.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["garrison_hq*"]

[tool.setuptools.package-data]
garrison_hq = ["migrations/*.py", "migrations/versions/*.py", "migrations/script.py.mako", "templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
