{% extends "base.html" %}
{% block title %}Sign up · garrison{% endblock %}
{% block content %}
<div class="auth-box panel">
  <h1>Create an account</h1>
  {% if signup_open %}
  <form data-api="POST /v1/auth/signup" data-then="/ui">
    <label>Email <input id="email" name="email" type="email" autocomplete="username" required></label>
    <label>Password (10+ characters) <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required></label>
    <div class="row"><button type="submit">Sign up</button><a href="/ui/login">I have an account</a></div>
    <p class="msg"></p>
  </form>
  {% else %}
  <p class="sub">Sign-up is closed on this server. An admin creates accounts with
    <code>garrison-hq create-user</code>.</p>
  <a href="/ui/login">Log in</a>
  {% endif %}
</div>
{% endblock %}
