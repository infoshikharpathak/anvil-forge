# garrison config template
#
# Edit this file, then import it on the Apps page: type the app name
# ("shop" below, or whatever you rename it to) and paste the file.
# Importing replaces that app's tools, agents, flows, settings and
# classifier with what's in the file.
#
# Rename "shop" everywhere: the app key under apps:, and the "shop." prefix
# on every agent and flow ID.

apps:
  shop:
    # Where Anvil sends tool calls: base_url + each tool's path.
    base_url: "http://localhost:8001"

    # If your API needs a token, Anvil adds it to every call. Put only the
    # NAME of the env var here, never the secret itself.
    # auth:
    #   header: Authorization
    #   secret_env: SHOP_API_TOKEN
    #   prefix: "Bearer "

    tools:
      # A read-only tool. trusted = no side effects, so it skips the
      # stricter checks. {order_id} in the path is filled from the params.
      get_order:
        path: "/orders/{order_id}"
        method: GET
        description: "Look up one order by its ID."
        trust: trusted
        timeout: 5
        injection_scanning: false
        parameters:
          type: object
          properties:
            order_id:
              type: string
              description: "The order ID, e.g. ORD-1001"
          required: [order_id]
        # Anvil rejects a response that's missing these fields.
        response_schema:
          required_fields: ["id", "status", "total"]

      list_orders:
        path: "/orders"
        method: GET
        description: "List the customer's recent orders, newest first."
        trust: trusted
        timeout: 5
        injection_scanning: false
        parameters:
          type: object
          properties:
            customer_id:
              type: string
              description: "The customer whose orders to list"
          required: [customer_id]

      # A tool with side effects. untrusted = injection scans and sequence
      # rules apply.
      refund_order:
        path: "/orders/{order_id}/refund"
        method: POST
        description: "Refund an order, fully or partly."
        trust: untrusted
        timeout: 10
        injection_scanning: true
        # Fields stripped from the response before the agent or any trace
        # sees them.
        redact_fields: [card_number]
        parameters:
          type: object
          properties:
            order_id:
              type: string
            amount:
              type: number
              description: "Amount to refund, in the order's currency"
            reason:
              type: string
          required: [order_id, amount, reason]

# Agent IDs are "<app>.<agent>". Inside an agent, bare tool names are its
# own app's tools.
agents:
  shop.support_agent:
    description: "Answers order questions and issues refunds within policy."
    prompt_version: v1          # a label for this version of the instructions
    backend: openai             # openai | anthropic
    model: gpt-4o-mini
    instructions: |
      You are the shop's support assistant.
      - Look up the order before answering anything about it.
      - Refund only when the customer asks, and only up to the order total.
      - Be brief and friendly.
    # The agent can call these tools and no others.
    tools: [get_order, list_orders, refund_order]
    # Call get_order for the same order_id before refund_order is allowed.
    sequences:
      - before: refund_order
        requires: [get_order]
        match_fields: [order_id]
    strictness: strict          # strict | loose
    # Per-agent trust, overriding the tool's own.
    trust_overrides:
      list_orders: trusted

  shop.refund_reviewer:
    description: "Second check on refunds before they're confirmed to the customer."
    prompt_version: v1
    backend: openai
    model: gpt-4o-mini
    instructions: |
      You review a proposed refund. Reply APPROVE or REJECT with one sentence why.
    tools: [get_order]

# Flows chain agents of the same app. Nodes and edges use bare agent names.
flows:
  shop.refund_flow:
    entry: support_agent
    nodes:
      - agent: support_agent
        task: "Handle the customer's request."
      - agent: refund_reviewer
        task: "Review the refund the support agent proposed."
    edges:
      - from: support_agent
        to: refund_reviewer

# Let this app use another app's tool. The other app must exist first under
# your account, with that tool. Then add it to an agent's tools as
# "notify.send_email".
# grants:
#   - tool: notify.send_email
#     to_apps: [shop]

# Passed to Anvil.
settings:
  injection_scanning: true
  default_strictness: strict
  default_trust: untrusted
  session_ttl: 3600             # seconds a session's sequence state lives

# LLM injection classifier for Anvil's scans. Uses the agents' provider and keys.
classifier:
  enabled: true
  provider: openai
  model: gpt-4o-mini

# What the SDK sends to this dashboard. Metadata only by default. With
# include_content: true, prompts and responses are sent too (secret-looking
# fields redacted). The app's URL and key come from GARRISON_URL and
# GARRISON_KEY; never put a key in this file.
dashboard:
  include_content: false
