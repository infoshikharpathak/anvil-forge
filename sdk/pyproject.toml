[project]
name = "garrison-sdk"
version = "0.1.1"
description = "Governed, traced AI agents: one platform SDK on Anvil (tool governance) and Agent Forge (agents). Register apps, tools, agents and flows once; every run is checked, executed and traced."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Shikhar Pathak" }]
requires-python = ">=3.11"
keywords = ["agents", "llm", "governance", "guardrails", "tracing", "openai", "anthropic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "garrison-anvil>=0.1.0,<0.2",
  # [langgraph]: run_flow executes flows on Agent Forge's graph runner.
  "garrison-forge[langgraph]>=0.1.0,<0.2",
  "pydantic>=2.0,<3",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Agents with backend: anthropic.
anthropic = ["garrison-forge[anthropic,langgraph]>=0.1.0,<0.2"]
dev = ["garrison-sdk[anthropic]", "pytest>=8", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/infoshikharpathak/garrison"
Repository = "https://github.com/infoshikharpathak/garrison"
Issues = "https://github.com/infoshikharpathak/garrison/issues"
Changelog = "https://github.com/infoshikharpathak/garrison/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["garrison*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
