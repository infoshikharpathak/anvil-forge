[project]
name = "anvil-forge"
version = "0.1.0"
description = "One platform SDK on top of Anvil (governance) and Agent Forge (agents): register apps, tools, agents and flows once; run them governed and traced."
requires-python = ">=3.11"
dependencies = [
  # Pinned to the current main commits (Anvil Phase 2, Agent Forge Phase 3).
  "anvil-ai @ git+https://github.com/infoshikharpathak/anvil.git@1a7c60a",
  "agent-forge @ git+https://github.com/infoshikharpathak/Agent-Forge.git@57d62a8",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["anvil_forge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
