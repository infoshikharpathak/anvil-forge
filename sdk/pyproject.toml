[project]
name = "garrison"
version = "0.1.0"
description = "One platform SDK on top of Anvil (governance) and Agent Forge (agents): register apps, tools, agents and flows once; run them governed and traced."
requires-python = ">=3.11"
dependencies = [
  # Pinned to the current main commits (Anvil Phase 2, Agent Forge Phase 3).
  # Full SHAs: pip only caches wheels built from git refs that are immutable commits.
  "anvil-ai @ git+https://github.com/infoshikharpathak/anvil.git@5110b3541403148d9acb3cf83e8d022dc0d01d34",
  "agent-forge @ git+https://github.com/infoshikharpathak/Agent-Forge.git@1321e70a3f169964835f1d378a37049d064b9edc",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["garrison*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
