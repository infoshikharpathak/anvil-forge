[project]
name = "bastion"
version = "0.1.0"
description = "One platform SDK on top of Anvil (governance) and Agent Forge (agents): register apps, tools, agents and flows once; run them governed and traced."
requires-python = ">=3.11"
dependencies = [
  # Pinned to the current main commits (Anvil Phase 2, Agent Forge Phase 3).
  # Full SHAs: pip only caches wheels built from git refs that are immutable commits.
  "anvil-ai @ git+https://github.com/infoshikharpathak/anvil.git@602894a42c9bbb97e8f3fe9fce27134f9fe82120",
  "agent-forge @ git+https://github.com/infoshikharpathak/Agent-Forge.git@cfbb83deeceb7999020ef941b30f19e5996ff83b",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bastion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
